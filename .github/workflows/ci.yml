name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR from a fork must be verifiable without secrets. Every test here runs
# offline against fakes — no provider credentials, no network. Provider health
# is a separate concern precisely because it fails for reasons a contributor
# cannot fix.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      # Catches the mistake that shipped once already: publishing src/ and
      # test/ to everyone because `files` was missing.
      - name: Check the published tarball contents
        run: |
          npm pack --silent > /dev/null
          tar -tzf open-supermarkets-*.tgz > /tmp/package-entries
          sed 's|^package/||' /tmp/package-entries | cut -d/ -f1 | sort -u > /tmp/shipped
          echo "Shipping:"; cat /tmp/shipped
          for unwanted in src test docs node_modules .github; do
            if grep -qx "$unwanted" /tmp/shipped; then
              echo "::error::$unwanted/ would be published to npm — check the \"files\" field"
              exit 1
            fi
          done
          test -s /tmp/shipped
          for required in worker.py browser.py actions.py model.py requirements.txt; do
            grep -qx "package/runtime/conad/$required" /tmp/package-entries
          done
          if grep -Eq '(__pycache__|\.pyc$|/Cookies$|/\.open-supermarkets-account\.json$)' /tmp/package-entries; then
            echo "::error::Python caches or browser state would be published"
            exit 1
          fi
          mkdir -p /tmp/conad-package
          tar -xzf open-supermarkets-*.tgz -C /tmp/conad-package
          cd /tmp
          python3 /tmp/conad-package/package/runtime/conad/worker.py --help
          test -f /tmp/conad-package/package/dist/cli.js
          test -f /tmp/conad-package/package/dist/mcp-server.js
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/conad-package/package/dist/cli.js providers --country IT --json

  conad-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Standard library only: no Chrome, SeleniumBase, credentials or network.
      - run: python3 test/conad_seleniumbase_unit.py
